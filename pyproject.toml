[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-lottery-assistant"
version = "0.1.1"
description = "Bilibili lottery assistant with a local HTML console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlmodel>=0.0.22,<1",
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "pydantic-settings>=2.6,<3",
  "platformdirs>=4.3,<5",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
bili-lottery-assistant = "backend.launcher:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web_static/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
