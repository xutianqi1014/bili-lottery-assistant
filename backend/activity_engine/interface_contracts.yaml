    missing_key_result: DEEPSEEK_NOT_CONFIGURED
    key_not_written_to_run_or_database: true
  status: IMPLEMENTED_OFFLINE_TESTED
  fallback: SAFE_BLOCK_BEFORE_BILIBILI_WRITE

- contract_id: OFFICIAL-PARTICIPATE-WRITE-001
  owner: official_flow
  capability: official_participation
  page_url_template: https://www.bilibili.com/opus/{dynamic_id}
  discovered_from:
    kind: page_dom
    url_pattern: a[data-type="lottery"] + iframe[src*="/h5/lottery/result"]
    evidence_fragment: ".side-toolbar__action.like.is-active / 开奖时间 / 已成功参与"
    verified_urls:
      - https://www.bilibili.com/opus/1232685708814057480
      - https://www.bilibili.com/opus/1231172523107811364
      - https://www.bilibili.com/opus/1231128413813604353
      - https://www.bilibili.com/opus/1229961252141268994
      - https://www.bilibili.com/opus/1230812226883944467
  request:
    method: DOM_CLICK
    origin: https://www.bilibili.com
    selector: iframe[src*="/h5/lottery/result"] + validated participation control + .bili-popup__header__close + .side-toolbar__action.like
    risk: write
    auth: logged_browser_context_required
  response:
    required_fields: [activity_like_state, lottery_panel_text, participation_terminal_text, lottery_popup_closed]
    active_lottery_rule: lottery_panel_text contains 开奖时间
    expired_lottery_rule: lottery_panel_text does not contain 开奖时间
    legacy_compatibility: pre-click participation success text returns ALREADY_PARTICIPATED with zero business-button clicks
    post_participation_sequence: close lottery popup and prove iframe detached before a non-forced dynamic-like click
    terminal_confirmation: "participation success text + .side-toolbar__action.like.is-active"
  controlled_automation:
    harness: backend/use_cases/official_participation_execution.py
    scope_authority: immutable_confirmed_run_plan
    enable_switch: BILI_OFFICIAL_AUTOMATION_ENABLED=true
    random_delay_seconds: [3, 5]
    max_dynamic_targets_per_run: unbounded_within_confirmed_plan
    per_target_manual_confirmation: false
  application_entrypoint:
    method: POST
    path: /api/runs/{run_id}/start
    csrf_required: true
    requires_confirmed_run_plan: true
    requires_official_automation_enabled: true
    persists_terminal_result: true
    cross_run_success_deduplication: false
    current_page_like_marker_is_authoritative: true
    unknown_result_policy: manual_review_no_retry
  evidence_files:
    - tests/fixtures/contracts/OFFICIAL-PARTICIPATE-WRITE-001/evidence-2026-08-09-1231128413813604353.json
    - tests/fixtures/contracts/OFFICIAL-PARTICIPATE-WRITE-001/automation-run-2026-08-09-run15.json
    - tests/fixtures/contracts/OFFICIAL-PARTICIPATE-WRITE-001/evidence-2026-08-10-1233672735227379797-popup.json
    - tests/fixtures/contracts/OFFICIAL-PARTICIPATE-WRITE-001/automation-run-2026-08-10-run20.json
  status: WRITE_TEST_PASSED
  fallback: AUTOMATION_STOPPED_MANUAL_REVIEW_NO_RETRY
