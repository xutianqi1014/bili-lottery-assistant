- contract_id: UNOFFICIAL-PARTICIPATE-WRITE-001
  owner: unofficial_flow
  capability: nonofficial_comment_repost_like_follow
  page_url_template: https://www.bilibili.com/opus/{dynamic_id}
  request:
    method: DOM_CLICK_AND_FILL
    origin: https://www.bilibili.com
    selectors:
      comment_editor: bili-comments bili-comment-box bili-comment-rich-textarea .brt-editor[contenteditable="true"]
      comment_publish: bili-comments bili-comment-box button[text="发布"]
      repost_checkbox: bili-comments bili-comment-box bili-checkbox[value="sync"]
      dynamic_like: .side-toolbar__action.like
      forward: .side-toolbar__action.forward
      follow_profile: .space-follow-btn
    risk: write
    auth: logged_browser_context_required
  response:
    normal_sequence: [comment_with_repost_checkbox, like, follow]
    boosted_sequence: [outer_repost, outer_comment, like, follow]
    comment_source: deepseek_chat_completions
    required_comment_parts: [generated_body, missing_topics, fixed_mentions]
    fixed_mention_limit: 3
    terminal_confirmation:
      comment: publish_click_accepted_without_comment_list_recheck
      repost: per_action_dom_state
      like: per_action_dom_state
      follow: per_action_dom_state
    comment_list_recheck: false
  application_entrypoint:
    method: POST
    path: /api/runs/{run_id}/start
    csrf_required: true
    requires_confirmed_run_plan: true
    requires_unofficial_automation_enabled: true
    requires_deepseek_api_key: true
    persists_terminal_result: true
    unknown_result_policy: manual_review_no_retry
  status: DOM_CONTRACT_IMPLEMENTED_OFFLINE_TESTED
  fallback: AUTOMATION_STOPPED_MANUAL_REVIEW_NO_RETRY

- contract_id: LOCAL-RUNTIME-SETTINGS-001
  owner: runtime_configuration
  capability: deepseek_and_unofficial_account_settings
  page_url_template: http://127.0.0.1:8787/
  request:
    method: POST
    path: /api/settings
    risk: local_secret_input
    auth: csrf_required
    fields:
      deepseekApiKey: write_only_runtime_secret
      deepseekApiUrl: https_url
      deepseekModel: model_name
      mentionNames: max_three_fixed_account_names
  response:
    deepseekConfigured: boolean_only
    mentionNames: normalized_names
    api_key_echo: forbidden
    persistence: process_memory_only
  application_usage:
